{% extends "layout.html" %}
{% block headlinks%}
<link href="/static/createpost.css" rel="stylesheet">
<script type="text/javascript" src="/static/scripts/forms.js"></script>
{% endblock %}
{% block title %}
    : Edit Post
{% endblock %}

{% block main %}
    <div class='box'>
        <h1>Edit '{{ post[2] }}'</h1>
        <form action="/editpost" method="post" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group col">
                    <label for="title">Title</label>
                    <input type="text" class="form-control" name='title' value="{{ post[2] }}">
                </div>
                <div class="form-group col">
                    <label for="category">Category*</label>
                    <select class = 'form-control' name='category'> 
                        <option value="{{ post[9] }}" >{{ post[9] }}</option>
                        <option value="Games">Games</option>
                        <option value="Leisure">Leisure</option>
                        <option value="Outdoors">Outdoors</option>
                        <option value="Socializing">Socializing</option>
                        <option value="Sport">Sports</option>
                        <option value="Technology">Technology</option>
                        <option value="Volunteering">Volunteering</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" name='description' value="{{ post[3] }}" rows="3"></textarea>
            </div>
            <label>Location</label>
            <div class="form-row">
                <div class="form-group col">
                    <select class = 'form-control' name='province' >
                        <option value="{{ post[4] }}">{{ post[4] }}</option>
                        <option value="AB">Alberta</option>
                        <option value="BC">British Columbia</option>
                        <option value="MB">Manitoba</option>
                        <option value="NB">New Brunswick</option>
                        <option value="NL">Newfoundland and Labrador</option>
                        <option value="NS">Nova Scotia</option>
                        <option value="ON">Ontario</option>
                        <option value="PE">Prince Edward Island</option>
                        <option value="QC">Quebec</option>
                        <option value="SK">Saskatchewan</option>
                        <option value="NT">Northwest Territories</option>
                        <option value="NU">Nunavut</option>
                        <option value="YT">Yukon</option>
                    </select>
                </div>
                <div class="form-group col">
                    <input type="text" class="form-control" name='city' value='{{ post[5] }}'>
                </div>
            </div> 
            <label>Contacts</label>
            <div class="form-row">
                <div class="form-group col">
                  <input type="email" class="form-control" name='email' value='{{ post[6] }}' >
                </div>
                <div class="form-group col">
                  <input type="text" class="form-control" name='phone' value='{{ post[7] }}' onkeypress="return isNumberKey(event)"/>
                </div>
            </div> 
            <div class="form-group">
                <label for="file">Upload Photo (PNG, JPG)</label><br>
                <input type="file" name='file'>
            </div>
            <input name="post_id" type="hidden" value="{{ post[0] }}">
            <button class="btn btn-primary" type="submit" value="upload">Edit Post</button>       
        </form>
    </div>

{% endblock %}
