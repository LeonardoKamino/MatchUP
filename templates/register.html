{% extends "layout.html" %}
{% block headlinks%}
<link href="/static/frontpages.css" rel="stylesheet">

{% endblock %}
{% block title %}
    : Register
{% endblock %}

{% block main %}
    <div class="register_box">
        <h1>Create your account:</h1>
        <form enctype="multipart/form-data" action="/register" method="post">
            <div class="form-group">
                <input autocomplete="off" autofocus class="form-control" name="username" id = "username" placeholder="Username" type="text">
                <p id="alert"></p>            
            </div>
            <div class="form-group">
                <input autocomplete="off" autofocus class="form-control" name="first_name" placeholder="First name" type="text">
            </div>
            <div class="form-group">
                <input autocomplete="off" autofocus class="form-control" name="last_name" placeholder="Last Name" type="text">
            </div>
            <div class="form-group">
                <input class="form-control" name="password" placeholder="Password" type="password">
            </div>
            <div class="form-group">
                <input class="form-control" name="confirmation" placeholder="Confirm Password" type="password">
            </div>
            <div class="form-group">
                <label for="image">Choose Profile Picture (PNG, JPG)</label><br>
                <input type="file" name='file'>
            </div>
            <button class="btn btn-primary" type="submit" id="submit_btn" value="upload">Register</button>
        </form>
        <script type="text/javascript" src="/static/scripts/forms.js"></script>

    </div>
{% endblock %}
